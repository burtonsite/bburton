<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> BuRTon | Ultimate Cyber System</title>
    <style>
        :root {
            --primary: #8a2be2; /* بنفش */
            --secondary: #00d4ff; /* آبی نئونی */
            --bg-dark: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* پس‌زمینه متحرک */
        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .main-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            background: rgba(15, 15, 25, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 30px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        /* پروفایل */
        .profile-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--secondary);
            box-shadow: 0 0 20px var(--primary);
            transition: opacity 0.5s ease-in-out;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to bottom, #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
            margin-bottom: 10px;
            transition: all 0.5s ease;
        }

        .bio {
            font-size: 0.9rem;
            color: #ccc;
            min-height: 60px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .typing-text { border-left: 2px solid var(--secondary); padding-left: 5px; }

        /* --- پلیر دیجیتال سفارشی --- */
        .custom-player {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(138, 43, 226, 0.5);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .play-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px var(--secondary);
            background: var(--secondary);
        }

        .progress-container {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 10px;
            box-shadow: 0 0 10px var(--secondary);
        }

        .time-info {
            font-size: 10px;
            color: var(--secondary);
            font-family: monospace;
        }

        @media (max-width: 480px) { .main-card { width: 90%; } }

/* استایل پایه برای چیدمان آیکون‌ها */
.social-links {
    display: flex;
    justify-content: center;
    gap: 20px; /* فاصله بین آیکون‌ها */
    margin: 20px 0; /* فاصله از بالا و پایین (از اسلایدر و پلیر) */
}

.social-icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.1); /* پس‌زمینه شیشه‌ای */
    border-radius: 50%; /* گرد کردن آیکون‌ها */
    border: 1px solid rgba(0, 212, 255, 0.3); /* حاشیه نئونی آبی */
    transition: 0.3s;
}

.social-icon img {
    width: 22px;
    height: 22px;
    filter: invert(1); /* سفید کردن آیکون‌ها برای هماهنگی با تم */
}

/* افکت هاور برای درخشش */
.social-icon:hover {
    transform: scale(1.2);
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.8);
    background: rgba(0, 212, 255, 0.2);
}

/* رنگ‌های خاص برای هر آیکون هنگام هاور */
.insta:hover { border-color: #E1306C; box-shadow: 0 0 15px #E1306C; }
.telegram:hover { border-color: #0088cc; box-shadow: 0 0 15px #0088cc; }
.web:hover { border-color: #ffffff; box-shadow: 0 0 15px #ffffff; }


    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="main-card">
        <div class="profile-wrapper">
            <img id="profile-img" src="photo 1.jpg" alt="Profile" class="profile-img">
        </div>

        <h1 id="display-name">BuRTon</h1>

        <div class="bio">
            <span id="typewriter" class="typing-text"></span>
        </div>

<!-- بخش آیکون‌ها - دقیقاً قبل از بخش موزیک قرار بگیرد -->
<div class="social-links">
    <a href="coming soon.png" target="_blank" class="social-icon insta">
        <img src="instagram.png" alt="Insta">
    </a>
    <a href="coming soon.png" target="_blank" class="social-icon telegram">
        <img src="telegram.png" alt="Tele">
    </a>
    <a href="coming soon.png" target="_blank" class="social-icon web">
        <img src="web.png" alt="Web">
    </a>
</div>


        <!-- پلیر سفارشی -->
        <div class="custom-player">
            <div class="controls">
                <button class="play-btn" id="playPauseBtn">▶</button>
            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-info">
                <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
            </div>
        </div>
    </div>
    <!-- تگ مخفی صدا -->
    <audio id="audio-element" src="m4.mp3" loop></audio>

    <script>
        // --- ۱. تنظیمات تغییر خودکار محتوا ---
        const data = [
            { name: "BURTON", bio: "> Access to the central core secured... BuRToN initiating infiltration sequence.", img: "G2 .gif" },
            { name: "Unknown", bio: "> Identity not detected... BuRToN is hidden within the code.", img: "G1 .gif" },
            { name: "GHOST", bio: "> Digital traces lead nowhere... BuRToN remains unseen across the web. 😈💻", img: "G3 .gif" }
        ];

        let currentIndex = 0;
        const nameEl = document.getElementById('display-name');
        const bioEl = document.getElementById('typewriter');
        const imgEl = document.getElementById('profile-img');

        function typeWriter(text, element, speed = 50) {
            element.innerHTML = "";
            let i = 0;
            function typing() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typing, speed);
                }
            }
            typing();
        }

        function updateContent() {
            const currentData = data[currentIndex];
            nameEl.style.opacity = 0;
            imgEl.style.opacity = 0;

            setTimeout(() => {
                nameEl.innerText = currentData.name;
                imgEl.src = currentData.img;
                nameEl.style.opacity = 1;
                imgEl.style.opacity = 1;
                typeWriter(currentData.bio, bioEl);
                currentIndex = (currentIndex + 1) % data.length;
            }, 500);
        }

        setInterval(updateContent, 6000); // هر ۶ ثانیه عوض شود
        window.onload = updateContent;

        // --- ۲. کنترل پلیر موسیقی ---
        const audio = document.getElementById('audio-element');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playPauseBtn.innerText = "⏸";
            } else {
                audio.pause();
                playPauseBtn.innerText = "▶";
            }
        });

        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = percent + "%";
            
            // نمایش زمان
            currentTimeEl.innerText = formatTime(audio.currentTime);
            if(audio.duration) durationEl.innerText = formatTime(audio.duration);
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        function formatTime(seconds) {
            let min = Math.floor(seconds / 60);
            let sec = Math.floor(seconds % 60);
            if (sec < 10) sec = '0' + sec;
            return min + ":" + sec;
        }

        // --- ۳. پس‌زمینه متحرک (Matrix Rain) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01ABCDEF<>[]{}?*#@&';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < drops.length; i++) {
                const colors = ['#8a2be2', '#00d4ff', '#4b0082'];
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.font = fontSize + 'px monospace';
                ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>

    <script>
    // این تابع تلاش می‌کند آهنگ را پخش کند
    function attemptAutoplay() {
        const audio = document.getElementById('audio-element');
        
        // سعی برای پخش خودکار
        audio.play().then(() => {
            // اگر پخش موفق بود، این رویداد را از صفحه حذف کن
            document.removeEventListener('click', attemptAutoplay);
            document.removeEventListener('touchstart', attemptAutoplay);
        }).catch(error => {
            // اگر مرورگر اجازه نداد، صبر می‌کند تا کاربر کلیک کند
            console.log("Autoplay prevented by browser. Waiting for user interaction...");
        });
    }

    // گوش دادن به اولین کلیک یا لمس کاربر در هر جای صفحه
    document.addEventListener('click', attemptAutoplay);
    document.addEventListener('touchstart', attemptAutoplay);
</script>

</body>
</html>
